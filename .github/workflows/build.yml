name: Build Flutter APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: 

jobs:
  build:
    name: Build & Export APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Fresh Project & Build
        run: |
          # ۱. ساخت پروژه جدید
          flutter create clean_tapsi_app
          
          # ۲. کپی کدهای شما
          cp lib/main.dart clean_tapsi_app/lib/main.dart
          cd clean_tapsi_app
          
          # ۳. 🚨 تزریق مجوز اینترنت به مانیفست اندروید 🚨
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml
          
          # ۴. دانلود پکیج‌ها
          flutter pub add http shared_preferences flutter_inappwebview
          
          # ۵. تزریق جادویی برای رفع باگ Proguard
          find ~/.pub-cache/hosted/pub.dev/ -type f -name "build.gradle" -exec sed -i 's/proguard-android.txt/proguard-android-optimize.txt/g' {} +
          
          # ۶. بیلد نهایی
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tapsi-Client-Release
          path: clean_tapsi_app/build/app/outputs/flutter-apk/app-release.apk
