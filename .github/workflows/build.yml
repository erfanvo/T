name: Build Flutter APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: 

jobs:
  build:
    name: Build & Export APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Fresh Project & Build
        run: |
          # ۱. ساخت یک پروژه فلاتر کاملاً جدید و تمیز در یک پوشه دیگر
          flutter create clean_tapsi_app
          
          # ۲. کپی کردن کدهای main.dart شما به داخل پروژه جدید
          cp lib/main.dart clean_tapsi_app/lib/main.dart
          
          # ۳. ورود به پوشه پروژه جدید
          cd clean_tapsi_app
          
          # ۴. اضافه کردن خودکار و استاندارد تمام پکیج‌ها (بدون نیاز به دستکاری pubspec)
          flutter pub add http shared_preferences flutter_inappwebview
          
          # ۵. بیلد گرفتن نسخه نهایی
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tapsi-Client-Release
          path: clean_tapsi_app/build/app/outputs/flutter-apk/app-release.apk
